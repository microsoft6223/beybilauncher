name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Depodaki dosyalar
        run: ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Zip'i ac
        run: unzip -q BeybiOS.zip

      - name: Debug APK derle
        working-directory: BeybiOS
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BeybiOS-debug-apk
          path: BeybiOS/app/build/outputs/apk/debug/app-debug.apk
